name: Continuous Integration


on:
  push:
    branches: [main]

  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "build.zig"
      - "build.zig.zon"
      - "tests/**"

  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        zig-version: ["0.17.0"]
        os: [ubuntu-latest, macos-latest, windows-latest]
        optimize: [debug, safe, fast, small]
        linkage: [static, dynamic]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig-version }}

      - name: Run `build`
        run: zig build -Doptimize=${{ matrix.optimize }} -Dlinkage=${{ matrix.linkage }} --summary all

      - name: Run round-trip tests
        run: zig build test -Doptimize=${{ matrix.optimize }} -Dlinkage=${{ matrix.linkage }} --summary all
